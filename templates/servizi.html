<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Preventivo</title>
<style>
  /* Layout "servizi": testata chiara, accenti blu, tabella servizi su fondo navy.
     Struttura tabellare: thead si ripete in cima a ogni pagina stampata,
     tfoot in fondo; il corpo non può mai finire sotto testata o piè. */
  :root {
    --navy: #0f1b3d;
    --blue: #2f6bff;
    --ink: #1f2937;
    --muted: #6b7281;
    --hair: #e5e7ee;
    --hdr-h: 27mm;
    --ftr-h: 11mm;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @page { size: A4; margin: 0; }
  html, body { width: 210mm; }
  body {
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--ink);
    font-size: 9.5pt;
    line-height: 1.45;
    background: #fff;
  }

  table.w { width: 210mm; border-collapse: collapse; }
  table.w > tbody > tr > td,
  table.w > thead > tr > td,
  table.w > tfoot > tr > td { padding: 0; vertical-align: top; }
  table.w > thead > tr > td { height: var(--hdr-h); background: #fff; }
  table.w > tbody > tr > td { height: calc(297mm - var(--hdr-h) - var(--ftr-h) - 1.5mm); }

  /* --- testata ripetuta --- */
  .pg-header { padding: 12mm 16mm 0; background: #fff; }
  .head-row { display: flex; justify-content: space-between; align-items: flex-start; }
  .wordmark { font-size: 21pt; font-weight: 800; letter-spacing: -0.4pt; color: var(--navy); }
  .head-info { text-align: right; font-size: 8pt; color: var(--muted); line-height: 1.55; }
  .head-info .em-nome { color: #111827; }
  .head-rule { border-bottom: 1.1mm solid var(--blue); margin-top: 4.5mm; }

  /* --- corpo --- */
  .pg-body { padding: 7mm 16mm 6mm; }

  .cols { display: flex; justify-content: space-between; gap: 10mm; }
  .col-label { font-size: 7.5pt; font-weight: 700; letter-spacing: 0.6pt; color: var(--blue); margin-bottom: 1.8mm; }
  .client-name { font-weight: 700; font-size: 10.5pt; color: #111827; }
  .client-lines { margin-top: 0.8mm; }
  .client-lines div { font-size: 9.5pt; color: #374151; }
  .pv-num { font-size: 10.5pt; color: #111827; }
  .pv-num b { font-weight: 700; }
  .pv-meta { margin-top: 1mm; }
  .pv-meta div { font-size: 9.5pt; color: #374151; }

  .oggetto { font-size: 15.5pt; font-weight: 700; color: var(--navy); margin-top: 8mm; letter-spacing: -0.2pt; }
  .intro { margin-top: 2.6mm; color: #374151; }

  table.sv { width: 100%; border-collapse: collapse; margin-top: 6.5mm; }
  table.sv thead th {
    background: var(--navy); color: #fff; font-size: 9pt; font-weight: 700;
    text-align: left; padding: 3mm 4mm;
  }
  table.sv thead th.num { width: 12mm; text-align: center; }
  table.sv tbody tr { page-break-inside: avoid; }
  table.sv tbody td { padding: 3.4mm 4mm; border-bottom: 1px solid var(--hair); vertical-align: top; }
  table.sv tbody td.num { text-align: center; color: var(--muted); font-size: 10pt; }
  .sv-tit { font-weight: 700; font-size: 10pt; color: #111827; }
  .sv-desc { color: var(--muted); font-size: 9pt; margin-top: 1.2mm; }

  .sv-totals { width: 64%; margin-left: auto; margin-top: 7mm; font-size: 10pt; page-break-inside: avoid; }
  .sv-totals .trow { display: flex; justify-content: space-between; padding: 2.4mm 0; }
  .sv-totals .trow .lbl { color: #111827; }
  .sv-totals .trow .val { font-weight: 700; color: #111827; white-space: nowrap; }
  .sv-totals .trow.mid .lbl { color: #374151; font-weight: 400; }
  .sv-totals .trow.mid .val { font-weight: 600; }
  .sv-totals .trow.tot { border-top: 0.5mm solid var(--navy); font-weight: 700; }
  .sv-totals .trow.rate .lbl, .sv-totals .trow.rate .val { font-weight: 400; color: #111827; }

  .cond-label { font-size: 7.5pt; font-weight: 700; letter-spacing: 0.6pt; color: var(--blue); margin-top: 9mm; margin-bottom: 2mm; page-break-after: avoid; }
  ul.cond { list-style: none; }
  ul.cond li { position: relative; padding-left: 4mm; font-size: 9pt; color: #374151; margin-bottom: 1.2mm; page-break-inside: avoid; }
  ul.cond li::before { content: "•"; position: absolute; left: 0.5mm; color: #374151; }
  .nota { margin-top: 3mm; font-size: 9pt; color: #374151; page-break-inside: avoid; }

  .sig-row { display: flex; justify-content: space-between; margin-top: 13mm; gap: 20mm; page-break-inside: avoid; }
  .sig { flex: 1; }
  .sig .sig-a { font-weight: 600; color: #111827; }
  .sig .sig-b { color: #374151; }
  .sig-line { width: 44mm; border-bottom: 1px solid #111827; margin-top: 13mm; }

  /* --- piè di pagina ripetuto --- */
  .pg-footer {
    padding: 2.8mm 16mm 4mm;
    border-top: 1px solid var(--hair);
    background: #fff;
    font-size: 7.5pt; color: var(--muted);
  }
</style>
</head>
<body>
  <table class="w">
    <thead>
      <tr>
        <td>
          <div class="pg-header">
            <div class="head-row">
              <div class="wordmark">{{WORDMARK}}</div>
              <div class="head-info">
                <div class="em-nome">{{EM_NOME}}</div>
                {{EM_INDIRIZZO_HTML}}
                {{EM_PIVA_HTML}}
                {{EM_SITO_HTML}}
              </div>
            </div>
            <div class="head-rule"></div>
          </div>
        </td>
      </tr>
    </thead>
    <tfoot>
      <tr>
        <td>
          <div class="pg-footer">
            <div>{{FOOTER_LEFT}}</div>
          </div>
        </td>
      </tr>
    </tfoot>
    <tbody>
      <tr>
        <td>
          <div class="pg-body">
<!--BODY-->
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</body>
</html>
